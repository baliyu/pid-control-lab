name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the Python packages
        run: python -m pip install -r requirements.txt
      - name: Test the PID, the supervisor and the closed loop (with the undefined-behaviour sanitiser)
        run: python -m pytest -q
      - name: Plot the closed loop (the picture must be produced)
        run: python tools/step_plot.py --out /tmp/step_response.png
